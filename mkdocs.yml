site_name: PamDx Data Analysis Guide
docs_dir: docs

nav:
  - Home: index.md
  - Part 1 - Tercen Data Analysis Guide:
    - Index: "Tercen Data Analysis Guide/index.md"
    - I. Experiment Design: "Tercen Data Analysis Guide/I. Experiment Design.md"
    - II. Image Analysis: "Tercen Data Analysis Guide/II. Image analysis.md"
    - III. Basic Processing: "Tercen Data Analysis Guide/III. Basic processing.md"
    - IV. Phosphosite Analysis: "Tercen Data Analysis Guide/IV. Phosphosite analysis.md"
    - V. Kinase Analysis: "Tercen Data Analysis Guide/V. Kinase analysis.md"
    - VI. Further Insights: "Tercen Data Analysis Guide/VI. Further insights.md"
    - Workflow Decisions: "Tercen Data Analysis Guide/Workflow Decisions in PamGene Data Analysis.md"
    - X. BioNavigator to Tercen: "Tercen Data Analysis Guide/X_How to bring data from BioNavigator to Tercen.md"
  - Part 2 - PamDx Methods:
    - Index: "PamDx methods/index.md"
    - Differential Phosphosite Analysis (Limma): "PamDx methods/Differential Phosphosite Analysis with Limma.md"
    - UKA: "PamDx methods/UKA.md"

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
